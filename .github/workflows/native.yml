name: Build native display extension

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-24.04
    outputs:
      profiles: ${{ steps.profiles.outputs.value }}
      tools: ${{ steps.profiles.outputs.tools }}
    steps:
      - uses: actions/checkout@v7
      - id: profiles
        run: |
          profiles=$(python3 -c 'import json,pathlib; print(json.dumps([p.stem for p in sorted(pathlib.Path("android/native/profiles").glob("*.json"))]))')
          echo "value=$profiles" >> "$GITHUB_OUTPUT"
          tools=$(python3 -c 'import json,pathlib; print(json.dumps(json.loads(pathlib.Path("android/native/runtime-tools.json").read_text())))')
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

  native:
    needs: profiles
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile: ${{ fromJSON(needs.profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v7
      - name: Identify native recipe
        id: recipe
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          digest=$(PYTHONPATH=scripts python3 -c 'import os,pathlib; from build_native import recipe_digest; print(recipe_digest(pathlib.Path("android/native/profiles")/(os.environ["PROFILE"]+".json")))')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: out/display-native
          key: display-native-${{ runner.os }}-${{ matrix.profile }}-${{ steps.recipe.outputs.digest }}
      - uses: android-actions/setup-android@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install native build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build bison flex libexpat1-dev android-libbase-dev libjsoncpp-dev libssl-dev
          ndk=$(python3 -c 'import json,os,pathlib; print(json.loads((pathlib.Path("android/native/profiles")/(os.environ["PROFILE"]+".json")).read_text())["ndkVersion"])')
          android --sdk="$ANDROID_HOME" sdk install "ndk/$ndk"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/waydroid-manager-native/archives
          key: native-sources-${{ runner.os }}-${{ hashFiles('android/native/profiles/*.json') }}
      - name: Build native display libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          PROFILE: ${{ matrix.profile }}
        run: python3 scripts/build_native.py "android/native/profiles/$PROFILE.json" out/display-native
      - uses: actions/cache/save@v6
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: out/display-native
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: display-native-${{ matrix.profile }}
          path: out/display-native
          if-no-files-found: error

  runtime-tools:
    needs: profiles
    strategy:
      matrix:
        tool: ${{ fromJSON(needs.profiles.outputs.tools) }}
    runs-on: ${{ matrix.tool.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        id: tools-cache
        with:
          path: out/display-tools
          key: display-tools-${{ matrix.tool.runner }}-${{ hashFiles('scripts/bundle_runtime_tools.py', 'android/native/runtime-tools.json') }}
      - name: Package offline resource compiler
        if: steps.tools-cache.outputs.cache-hit != 'true'
        env:
          MACHINE: ${{ matrix.tool.machine }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends aapt
          python3 scripts/bundle_runtime_tools.py out/display-tools --machine "$MACHINE"
      - uses: actions/cache/save@v6
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: out/display-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: display-tools-${{ matrix.tool.machine }}
          path: out/display-tools
          if-no-files-found: error
