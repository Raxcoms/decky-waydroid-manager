name: Build Decky plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Record build revision
        id: revision
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install Android build dependencies
        run: android --sdk="$ANDROID_HOME" sdk install build-tools/35.0.0 platforms/android-35
      - name: Build Android verification helper
        run: python3 scripts/build_android.py
      - name: Check Wayland relay
        run: |
          python3 -m unittest discover -s tests -v
          node --experimental-strip-types --test tests/*.test.mts
          for script in bin/waydroid-launcher bin/waydroid-game-session bin/waydroid-session; do
            bash -n "$script"
          done
      - name: Package plugin
        env:
          BUILD_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          python3 scripts/package.py package --revision "$BUILD_REVISION"
          python3 scripts/check_package.py package/waydroid-manager
      - uses: actions/upload-artifact@v7
        with:
          name: waydroid-manager-${{ steps.revision.outputs.sha }}
          path: package
