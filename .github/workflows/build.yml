name: Build Decky plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - name: Check Wayland relay
        run: |
          python3 -m unittest discover -s tests -v
          node --experimental-strip-types --test tests/*.test.mts
          bash -n bin/waydroid-launcher bin/waydroid-session
      - name: Package plugin
        run: python3 scripts/package.py package
      - uses: actions/upload-artifact@v4
        with:
          name: waydroid-manager
          path: package
