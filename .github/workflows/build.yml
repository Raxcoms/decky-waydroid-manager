name: Build Decky plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - name: Package plugin
        run: |
          mkdir -p package/waydroid-manager/bin package/waydroid-manager/dist
          cp plugin.json package.json README.md LICENSE main.py package/waydroid-manager/
          cp -r docs package/waydroid-manager/
          cp bin/waydroid-launcher package/waydroid-manager/bin/
          cp -r dist/. package/waydroid-manager/dist/
          chmod +x package/waydroid-manager/bin/waydroid-launcher
          cd package && zip -r ../waydroid-manager.zip waydroid-manager
      - uses: actions/upload-artifact@v4
        with:
          name: waydroid-manager
          path: waydroid-manager.zip
