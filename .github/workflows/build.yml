name: Build Decky plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'
      - name: Build Android verification helper
        run: python3 scripts/build_android.py
      - name: Check Wayland relay
        run: |
          python3 -m unittest discover -s tests -v
          node --experimental-strip-types --test tests/*.test.mts
          bash -n bin/waydroid-launcher bin/waydroid-session
      - name: Package plugin
        run: |
          python3 scripts/package.py package
          python3 scripts/check_package.py package/waydroid-manager
      - uses: actions/upload-artifact@v4
        with:
          name: waydroid-manager
          path: package
