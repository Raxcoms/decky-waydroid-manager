name: Publish Waydroid Manager release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version from package.json (major.minor.patch)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release_version: ${{ inputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: waydroid-manager-${{ inputs.version }}.zip
          skip-decompress: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          tags=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')
          if grep -Fxq "refs/tags/$tag" <<< "$tags"; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi
          gh release create "$tag" "waydroid-manager-$RELEASE_VERSION.zip" \
            --target "$GITHUB_SHA" --title "$RELEASE_VERSION" --generate-notes
